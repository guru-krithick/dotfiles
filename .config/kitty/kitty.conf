font_family      Maple Mono NF
font_size        18
font_features    MapleMono-NF-Regular +cv01 +liga +calt
modify_font      cell_height 110%

cursor_shape           block
cursor_blink_interval  0.5
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

background        #000000
foreground        #ffffff
cursor            #fefefe
cursor_text_color #000000
selection_background #222222
selection_foreground #cccccc

color0  #000000
color1  #f07178
color2  #c3e88d
color3  #ffcb6b
color4  #82aaff
color5  #c792ea
color6  #89ddff
color7  #cccccc
color8  #404040
color9  #f6a9ae
color10 #dbf1ba
color11 #ffdfa6
color12 #b4ccff
color13 #ddbdf2
color14 #b8eaff
color15 #ffffff

# Theme roles in slots 112-142 of the 256-colour palette. yazi's flavor, fzf,
# fastfetch and delta draw with these slots instead of hex colours, so a reload
# recolours open apps and already printed output. Nothing else here draws with
# the block: the shell, ls and git use ANSI 0-15, the base16-256 bat fallback
# 16-21, systemd 100/185/245 and the tmux.conf fallbacks 236-245. Ultra Dark's
# values until Noctalia renders noctalia-roles.conf;
# noctalia/templates/kitty-roles.conf names each role.
color112 #070908
color113 #141a16
color114 #26312a
color115 #2b352e
color116 #555f58
color117 #a6b1a9
color118 #e6ece7
color119 #b8c7bc
color120 #0a100c
color121 #3c423e
color122 #96e9ac
color123 #9fb2a5
color124 #0a100c
color125 #c6c9c0
color126 #0a100c
color127 #40423f
color128 #c6c9c0
color129 #cde996
color130 #f07178
color131 #4c2829
color132 #f17278
color133 #361719
color134 #5d2326
color135 #242e14
color136 #3d511f
color137 #435648
color138 #5e7865
color139 #7c9883
color140 #9eb3a4
color141 #c0cec4
color142 #e2e9e4

# Theme colours, written by Noctalia's kitty and kitty-roles templates whenever
# the palette changes; they override the fallback palette above. kitty skips an
# include while its file does not exist yet.
include themes/noctalia.conf
include themes/noctalia-roles.conf

placement_strategy      center
confirm_os_window_close 0
background_opacity      0.6
background_blur         25
# Space inside the window (in pt): top/bottom, then left/right, so the prompt
# arrow and fastfetch don't touch the window edge.
window_padding_width    4 10

mouse_hide_wait         3.0
wheel_scroll_multiplier 3.0
focus_follows_mouse     no

shell_integration       no-cursor no-title

scrollback_lines        100000

clipboard_control       write-clipboard write-primary read-clipboard read-primary
paste_actions           quote-urls-at-prompt,confirm-if-large
