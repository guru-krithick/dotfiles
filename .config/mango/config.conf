# Colors
rootcolor=0x222222ff
bordercolor=0x222222ff
focuscolor=0x393939ff
urgentcolor=0xa08080ff
scratchpadcolor=0x4a4a4aff

# Borders & Gaps
borderpx=2
gappih=4
gappiv=4
gappoh=2
gappov=2
no_border_when_single=1

# Visuals
border_radius=8
blur=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=8
blur_params_noise=0.08
blur_params_brightness=1.1
blur_params_saturation=1.1
shadows=0

# Opacity
focused_opacity=0.97
unfocused_opacity=0.92

# Animations
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.9
zoom_initial_ratio=0.85
zoom_end_ratio=1.0
tag_animation_direction=1
animation_duration_open=260
animation_duration_close=180
animation_duration_move=240
animation_duration_tag=250
animation_curve_open=0.16,1,0.3,1
animation_curve_close=0.4,0,1,1
animation_curve_move=0.16,1,0.3,1
animation_curve_tag=0.22,1,0.36,1

# Overview
enable_hotarea=1
hotarea_size=10
ov_tab_mode=1
overviewgappi=6
overviewgappo=24
jump_label_decorate_fg_color=0xe8e8e8ff
jump_label_decorate_bg_color=0x222222ff
jump_label_decorate_focus_fg_color=0x222222ff
jump_label_decorate_focus_bg_color=0xe8e8e8ff
jump_label_decorate_border_color=0x393939ff
jump_label_decorate_border_width=2
jump_label_decorate_corner_radius=8
jump_label_decorate_padding_x=16
jump_label_decorate_padding_y=16
jump_label_decorate_font_desc=MapleMono NF Bold 30

# Group Bar
group_bar_height=30
group_bar_decorate_fg_color=0x9a9a9aff
group_bar_decorate_bg_color=0x222222ff
group_bar_decorate_focus_fg_color=0x222222ff
group_bar_decorate_focus_bg_color=0xe8e8e8ff
group_bar_decorate_border_color=0x393939ff
group_bar_decorate_border_width=1
group_bar_decorate_corner_radius=6
group_bar_decorate_padding_x=10
group_bar_decorate_padding_y=0
group_bar_decorate_font_desc=MapleMono NF 13

# Behavior
focus_on_activate=1
sloppyfocus=0
warpcursor=1
single_scratchpad=1
focus_cross_monitor=1
exchange_cross_monitor=1
focus_cross_tag=1
view_current_to_back=1
enable_floating_snap=1
snap_distance=30
drag_tile_to_tile=1
cursor_hide_on_keypress=1
cursor_hide_timeout=0
cursor_size=24
cursor_theme=Adwaita
syncobj_enable=1
xwayland_persistence=1
idleinhibit_ignore_visible=1
enable_hotarea=0
view_current_to_back=0

# Env vars
env=XDG_CURRENT_DESKTOP,wlroots
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=GTK_THEME,Adwaita:dark
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# Start ups
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
exec-once=sh -c 'sleep 1; systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP; systemctl --user restart xdg-desktop-portal xdg-desktop-portal-wlr'
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=swaybg -i ~/Pictures/wallpaper.jpg -m fill
exec-once=mako
exec-once=swayidle -w timeout 300 'swaylock -f -C ~/.config/swaylock/config' timeout 330 'wlopm --off "*"' resume 'wlopm --on "*"' before-sleep 'swaylock -f -C ~/.config/swaylock/config' lock 'swaylock -f -C ~/.config/swaylock/config'
exec=pkill -x waybar; waybar

# Keyboard
repeat_delay=300
repeat_rate=30
numlockon=0
xkb_rules_layout=us
xkb_rules_options=caps:escape

# Mouse
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.0
axis_scroll_factor=1.0

# Trackpad
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
trackpad_accel_profile=2
trackpad_accel_speed=0.3
trackpad_scroll_factor=1.0
scroll_method=1
click_method=2
send_events_mode=2
swipe_min_threshold=20
button_map=0

# Tags
tag_num=9
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:monocle,no_render_border:1
tagrule=id:4,layout_name:tile,nmaster:1,mfact:0.55
tagrule=id:5,layout_name:fair
tagrule=id:6,layout_name:fair
tagrule=id:7,layout_name:monocle,no_render_border:1
tagrule=id:8,layout_name:fair
tagrule=id:9,layout_name:fair

# Scroller
scroller_structs=0
scroller_default_proportion=1.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.67,1.0
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1

# Outputs
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:120,x:1920,y:0,scale:1

# Rules
layerrule=noanim:1,noblur:1,layer_name:selection
layerrule=noanim:1,noblur:1,layer_name:waybar
layerrule=noanim:1,noblur:1,layer_name:swaybg
layerrule=animation_type_open:zoom,animation_type_close:fade,layer_name:rofi
layerrule=animation_type_open:slide,animation_type_close:fade,layer_name:notifications
layerrule=shield_when_capture:1,layer_name:notifications

windowrule=tags:1,appid:zen.*
windowrule=tags:1,appid:chromium
windowrule=tags:4,appid:org.pwmt.zathura
windowrule=tags:4,appid:com.github.johnfactotum.Foliate
windowrule=tags:4,istagsilent:1,appid:Postman
windowrule=tags:7,istagsilent:1,appid:discord
windowrule=tags:7,istagsilent:1,appid:vesktop

windowrule=shield_when_capture:1,appid:.*[Bb]itwarden.*
windowrule=shield_when_capture:1,appid:gcr-prompter
windowrule=shield_when_capture:1,appid:polkit-gnome-authentication-agent-1

windowrule=isfloating:1,title:^Authentication Required$
windowrule=isfloating:1,appid:gcr-prompter
windowrule=isfloating:1,appid:polkit-gnome-authentication-agent-1
windowrule=isfloating:1,appid:pavucontrol,width:800,height:600
windowrule=isfloating:1,appid:blueman-manager,width:700,height:500
windowrule=isfloating:1,appid:.blueman-manager-wrapped,width:700,height:500
windowrule=isfloating:1,appid:nm-connection-editor,width:800,height:600
windowrule=isfloating:1,appid:imv,width:1280,height:800

windowrule=isfloating:1,appid:thunar,title:File Operation Progress
windowrule=isfloating:1,appid:thunar,title:Confirm to replace files
windowrule=isfloating:1,appid:thunar,title:^Rename.*

windowrule=isfloating:1,appid:zen.*,title:^Library$
windowrule=isfloating:1,appid:zen.*,title:.*Sharing Indicator.*
windowrule=isfloating:1,appid:chromium,title:^Save File$
windowrule=isfloating:1,appid:chromium,title:^Open File$

windowrule=isfloating:1,isglobal:1,appid:mpv,idleinhibit_when_focus:1
windowrule=isfloating:1,isglobal:1,isnoborder:1,width:640,height:360,offsetx:-30,offsety:-30,title:Picture-in-Picture
windowrule=idleinhibit_when_focus:1,appid:zen.*
windowrule=idleinhibit_when_focus:1,appid:chromium

windowrule=focused_opacity:0.94,unfocused_opacity:0.88,appid:kitty
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:zen.*
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:chromium
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:org.pwmt.zathura
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:imv
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:mpv

# Bindings
circle_layout=scroller,fair,monocle,tile

keymode=common
bind=SUPER+SHIFT,c,reload_config
bind=SUPER,Escape,setkeymode,default
keymode=default

bind=SUPER,Return,spawn,kitty
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER+SHIFT,b,spawn,zen-browser
bind=SUPER+SHIFT,x,spawn,chromium
bind=SUPER+SHIFT,e,spawn,thunar
bind=SUPER,F2,spawn,~/.config/rofi/power-menu.sh

bind=SUPER+SHIFT,v,spawn,sh -c 'cliphist list | rofi -dmenu -theme ~/.config/rofi/clipboard.rasi -p "󰅍" | cliphist decode | wl-copy'
bind=SUPER+CTRL,Delete,spawn,sh -c 'cliphist wipe && notify-send "Clipboard cleared"'

bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER,x,togglemaximizescreen
bind=SUPER,z,zoom
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,minus,toggle_scratchpad
bind=SUPER+SHIFT,minus,minimized

bind=SUPER,h,focus_window_or_workspace,left
bind=SUPER,j,focus_window_or_workspace,down
bind=SUPER,k,focus_window_or_workspace,up
bind=SUPER,l,focus_window_or_workspace,right
bind=SUPER,Left,focus_window_or_workspace,left
bind=SUPER,Down,focus_window_or_workspace,down
bind=SUPER,Up,focus_window_or_workspace,up
bind=SUPER,Right,focus_window_or_workspace,right

bind=ALT,Tab,focuslast
bind=SUPER,Tab,focusstack,1
bind=SUPER+SHIFT,Tab,focusstack,-1

bind=SUPER,slash,togglejump
bind=SUPER,grave,toggleoverview
bind=SUPER+CTRL,0,view,0

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

bind=SUPER,s,setlayout,scroller
bind=SUPER,t,setlayout,tile
bind=SUPER,m,setlayout,monocle
bind=SUPER,g,setlayout,fair
bind=SUPER,v,setlayout,vertical_tile
bind=SUPER,w,setlayout,deck
bind=SUPER,e,switch_layout

bind=SUPER+CTRL,h,setmfact,-0.05
bind=SUPER+CTRL,l,setmfact,+0.05
bind=SUPER+CTRL,Left,setmfact,-0.05
bind=SUPER+CTRL,Right,setmfact,+0.05
bind=SUPER,i,incnmaster,+1
bind=SUPER,p,incnmaster,-1

bind=SUPER+CTRL,s,switch_proportion_preset
bind=SUPER+CTRL,m,set_proportion,1.0
bind=SUPER+CTRL,bracketright,scroller_stack,right
bind=SUPER+CTRL,bracketleft,scroller_stack,left

bind=SUPER+SHIFT,g,groupjoin,right
bind=SUPER+SHIFT,u,groupleave
bind=SUPER,bracketleft,groupfocus,prev
bind=SUPER,bracketright,groupfocus,next

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER,n,viewtoright_have_client
bind=SUPER,b,viewtoleft_have_client

bind=SUPER,r,setkeymode,resize

keymode=resize
bind=NONE,h,resizewin,-30,0
bind=NONE,j,resizewin,0,+30
bind=NONE,k,resizewin,0,-30
bind=NONE,l,resizewin,+30,0
bind=NONE,Left,resizewin,-30,0
bind=NONE,Down,resizewin,0,+30
bind=NONE,Up,resizewin,0,-30
bind=NONE,Right,resizewin,+30,0
bind=NONE,Return,setkeymode,default
keymode=default

bind=SUPER+CTRL,BackSpace,spawn,sh -c 'swaylock -f -C ~/.config/swaylock/config'
bind=SUPER+CTRL,End,spawn,sh -c 'swaylock -f -C ~/.config/swaylock/config && systemctl suspend'
bind=SUPER+CTRL,u,spawn,systemctl poweroff
bind=SUPER+CTRL,r,spawn,systemctl reboot
bind=SUPER,F10,toggle_trackpad_enable
bind=SUPER+SHIFT,f,spawn,~/.local/bin/powerboost toggle

bind=SUPER+SHIFT,F1,setoption,blur,0
bind=SUPER+SHIFT,F2,setoption,blur,1
bind=SUPER+CTRL,F1,setoption,animations,0
bind=SUPER+CTRL,F2,setoption,animations,1

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

bind=SUPER,Print,spawn,~/.config/mango/scripts/screenshot-region-file.sh
bind=SUPER+SHIFT,p,spawn,~/.config/mango/scripts/screenshot-full-file.sh
bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/screenshot-clip.sh
bind=SUPER+SHIFT,r,spawn,~/.config/mango/scripts/record-start.sh
bind=SUPER+CTRL,Escape,spawn,sh -c 'pkill -INT wf-recorder && notify-send "Recording saved"'

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,killclient,0

gesturebind=NONE,left,3,focusdir,right
gesturebind=NONE,right,3,focusdir,left
gesturebind=NONE,up,3,focusdir,up
gesturebind=NONE,down,3,focusdir,down
gesturebind=NONE,left,4,viewtoright_have_client
gesturebind=NONE,right,4,viewtoleft_have_client
gesturebind=NONE,up,4,togglejump
gesturebind=NONE,down,4,toggleoverview
