# Tokyo Night: a dock-like strip at the bottom. One floating pill centred
# under the windows, no chips: the tags as dots with the focused app on the
# current one, the song in the middle, the clock and a few status glyphs at
# the right end. Panels open from the bottom edge.

[bar]
order = ["default"]

[bar.default]
position = "bottom"
thickness = 40
margin_edge = 8
margin_ends = "21%"                      # about 1110 px wide on a 1920 px screen
padding = 16
widget_spacing = 16
background_opacity = 1.0
border = "outline_variant"
border_width = 1.0
radius = 20                              # round ends, half the thickness
concave_edge_corners = false
shadow = false
scale = 1.35
font_scale = 0.85                       # larger icons; keep labels at roughly 16 px
font_weight = 500
capsule = false

start = ["workspaces", "pomodoro"]
center = ["media"]
end = ["privacy", "group:status", "group:tools", "tray", "notifications", "clock"]

# Status and tools are two quiet clusters: tighter inside, a wider gap
# between. The groups draw no capsule of their own.
[[bar.default.capsule_group]]
id = "status"
members = ["volume", "network", "battery"]
opacity = 0.0
border = ""
padding = 0.0
widget_spacing = 12

[[bar.default.capsule_group]]
id = "tools"
members = ["powerboost", "caffeine", "wallpaper"]
opacity = 0.0
border = ""
padding = 0.0
widget_spacing = 12

# Dots for the other tags; the current one opens into a pill with its app.
[widget.workspaces]
style = "focus_hint"
scale = 1.3                              # larger dots and pill
hide_when_empty = true
focused_color = "primary"
occupied_color = "on_surface_variant"
empty_color = "outline_variant"
urgent_color = "error"

[widget.pomodoro]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/pomodoro-widget quiet"
interval = 1
interval_units = "1"
json = true

[widget.pomodoro.actions]
left = "exec ~/.config/waybar/scripts/pomodoro.sh start"
right = "exec ~/.config/waybar/scripts/pomodoro.sh toggle"
middle = "exec ~/.config/waybar/scripts/pomodoro.sh reset"
scroll_up = "exec ~/.config/waybar/scripts/pomodoro.sh add"
scroll_down = "exec ~/.config/waybar/scripts/pomodoro.sh sub"

[widget.media]
hide_when_no_media = true
max_length = 240                         # leaves room for the tray and bell beside it
art_size = 20
title_scroll = "on_hover"
color = "on_surface_variant"

[widget.privacy]
hide_inactive = true
active_color = "error"

[widget.volume]
show_label = false
peek = true
mute_color = "on_surface_variant"
color = "on_surface_variant"

[widget.network]
show_label = false
color = "on_surface_variant"

[widget.battery]
display_mode = "glyph"
show_label = true
color = "on_surface_variant"

[widget.notifications]
hide_when_no_unread = true
color = "on_surface_variant"

# The time; the date shows on hover, the dashboard on click, and middle-click
# starts a focus session (the timer appears beside the tags while it runs).
[widget.clock]
format = "{:%H:%M}"
timezone = "Asia/Kolkata"
font_weight = 700
tooltip_format = "{:%A, %d %B %Y}"

[widget.clock.actions]
left = "panel-toggle control-center home"
middle = "exec ~/.config/waybar/scripts/pomodoro.sh start"

# The native indicator follows power-profiles-daemon without shell polling;
# every profile change goes through the existing boost script.
[widget.powerboost]
type = "power_profile"

[widget.powerboost.actions]
left = "exec ~/.local/bin/powerboost toggle"
right = "exec ~/.local/bin/powerboost toggle"
scroll_up = "none"
scroll_down = "none"

[widget.tray]
drawer = true

# Opens the wallpaper picker (also Super+Shift+W).
[widget.wallpaper]
glyph = "photo"
color = "on_surface_variant"

# The bar is at the bottom, so toasts and the volume/brightness pop-up use
# the bottom edge too instead of opening a second active edge at the top.
[notification]
position = "bottom_right"

[osd]
position = "bottom_center"
offset_y = 56                            # 8 px above the bar
