# Theme roles in kitty's extended palette, rendered by Noctalia from
# ~/.config/noctalia/templates/kitty-roles.conf. yazi's flavor, fzf, fastfetch
# and delta name these slots instead of hex colours, so when kitty reloads on a
# theme switch, open apps and already printed output recolour too. The slot
# block and its fallback values are in kitty/kitty.conf; keep the two in step.

# Surfaces and text
color112 {{ colors.surface.default.hex }}
color113 {{ colors.surface_variant.default.hex }}
color114 {{ colors.surface_container_highest.default.hex }}
color115 {{ colors.outline_variant.default.hex }}
color116 {{ colors.outline.default.hex }}
color117 {{ colors.on_surface_variant.default.hex }}
color118 {{ colors.on_surface.default.hex }}

# Accents
color119 {{ colors.primary.default.hex }}
color120 {{ colors.on_primary.default.hex }}
color121 {{ colors.primary_container.default.hex }}
color122 {{ colors.primary_fixed_dim.default.hex }}
color123 {{ colors.secondary.default.hex }}
color124 {{ colors.on_secondary.default.hex }}
color125 {{ colors.tertiary.default.hex }}
color126 {{ colors.on_tertiary.default.hex }}
color127 {{ colors.tertiary_container.default.hex }}
color128 {{ colors.on_tertiary_container.default.hex }}
color129 {{ colors.tertiary_fixed_dim.default.hex }}

# Errors
color130 {{ colors.error.default.hex }}
color131 {{ colors.error_container.default.hex }}
color132 {{ colors.on_error_container.default.hex }}

# Diff lines for delta: muted, dark tints of the theme's red and green
# (removed, removed word, added, added word).
color133 {{ colors.terminal_normal_red.default.hex | set_saturation: 40.0 | set_lightness: 15.0 }}
color134 {{ colors.terminal_normal_red.default.hex | set_saturation: 45.0 | set_lightness: 25.0 }}
color135 {{ colors.terminal_normal_green.default.hex | set_saturation: 40.0 | set_lightness: 13.0 }}
color136 {{ colors.terminal_normal_green.default.hex | set_saturation: 45.0 | set_lightness: 22.0 }}

# fastfetch's shade bar: the accent at six lightnesses, dark to light. No six
# palette roles get lighter in the same order in every theme, and the darkest
# roles vanish on kitty's translucent background.
color137 {{ colors.primary.default.hex | set_lightness: 30.0 }}
color138 {{ colors.primary.default.hex | set_lightness: 42.0 }}
color139 {{ colors.primary.default.hex | set_lightness: 54.0 }}
color140 {{ colors.primary.default.hex | set_lightness: 66.0 }}
color141 {{ colors.primary.default.hex | set_lightness: 78.0 }}
color142 {{ colors.primary.default.hex | set_lightness: 90.0 }}
