set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -sa terminal-features ",*:usstyle"
set-option -g history-limit 50000
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g mouse on
set-window-option -g mode-keys vi
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g set-clipboard on

set-option -g repeat-time 300
set-option -s buffer-limit 20
set-option -g display-time 2000
set-option -g allow-rename off
set-window-option -g aggressive-resize on
set-option -g detach-on-destroy off

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r m resize-pane -Z

# -r repeats without re-pressing the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r Space next-layout

bind-key ! break-pane -d
bind-key @ command-prompt -p "join pane from:" "join-pane -s '%%'"

bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "wl-copy"

bind-key -r f display-popup -E -w 80% -h 80% "~/.config/tmux/scripts/tmux-sessionizer.sh"

bind-key C-j display-popup -E -w 60% -h 60% "\
    tmux list-sessions -F '#{session_name}: #{session_windows} windows' | \
    fzf --reverse --header 'Switch Session' --preview 'tmux list-windows -t {}' | \
    cut -d: -f1 | xargs tmux switch-client -t"

bind-key C-w display-popup -E -w 60% -h 60% "\
    tmux list-windows -F '#{window_index}: #{window_name} #{pane_current_path}' | \
    fzf --reverse --header 'Switch Window' | \
    cut -d: -f1 | xargs tmux select-window -t"

bind-key C-k confirm-before -p "kill-session #S? (y/n)" kill-session

bind-key -n M-` if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 80% -E \
    'tmux attach-session -t scratch || tmux new-session -s scratch'
}

# Status line. These used to cat vim-tpipeline's vimbridge files, so dropping
# that plugin left the bar empty; rendered natively now.
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g status-style "bg=#1c1c24,fg=#9f9fb3"
set-option -g status-left-length 60
set-option -g status-right-length 80
set-option -g status-justify absolute-centre

# Session name, plus a marker while the prefix is held.
set-option -g status-left "#[fg=#1c1c24,bg=#8ba7c7,bold] #S #[fg=#8ba7c7,bg=#1c1c24,nobold]#{?client_prefix, #[fg=#f3be7c]●,}"
set-option -g status-right "#[fg=#606079]#{b:pane_current_path} #[fg=#4a4a57]│ #[fg=#9f9fb3]%H:%M "

set-option -g window-status-format "#[fg=#606079] #I #W "
set-option -g window-status-current-format "#[fg=#f3be7c,bold] #I #W "
set-option -g window-status-separator ""

set-option -g message-style "bg=#1c1c24,fg=#f3be7c"
set-option -g mode-style "bg=#8ba7c7,fg=#1c1c24"

set-option -g pane-border-style "fg=#3a3a45"
set-option -g pane-active-border-style "fg=#f3be7c"
set-option -g pane-border-lines heavy

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fcsonline/tmux-thumbs'

# Initialize TPM (must be the last line)
run '~/.tmux/plugins/tpm/tpm'
