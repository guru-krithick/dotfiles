# Terminal
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"
set-option -as terminal-features ",*:usstyle"
set-option -g set-titles on
set-option -g set-titles-string "#S: #W"

# Core
set-option -g history-limit 50000
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g mouse on
set-window-option -g mode-keys vi
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g set-clipboard on
set-option -g repeat-time 500
set-option -s buffer-limit 20
set-option -g display-time 2000
set-option -g allow-rename off
set-window-option -g automatic-rename off
set-window-option -g aggressive-resize on
set-option -g detach-on-destroy off

# Prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key a last-window
bind-key r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Panes and windows
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key m resize-pane -Z
bind-key x kill-pane
bind-key ! break-pane -d
bind-key @ command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key Space next-layout

# Navigate panes with prefix+hjkl, leaving C-hjkl free for nvim
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize, repeatable
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Move windows
bind-key -n C-S-Left swap-window -t -1 \; select-window -t -1
bind-key -n C-S-Right swap-window -t +1 \; select-window -t +1

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"
bind-key p run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# Jump to a path or URL on screen, then yank it
bind-key u copy-mode \; send-keys -X search-backward "(https?://|git@|~/|/[[:alnum:]_.-]+/)[[:graph:]]*"

# Popups
bind-key C-j display-popup -E -w 60% -h 60% "tmux list-sessions -F '#{session_name}: #{session_windows} windows' | fzf --reverse --header 'session' --preview 'tmux list-windows -t {1}' | cut -d: -f1 | xargs -r tmux switch-client -t"
bind-key C-w display-popup -E -w 60% -h 60% "tmux list-windows -F '#{window_index}: #{window_name} #{pane_current_path}' | fzf --reverse --header 'window' | cut -d: -f1 | xargs -r tmux select-window -t"
bind-key g display-popup -d "#{pane_current_path}" -E -w 90% -h 90% "lazygit"
bind-key C-k confirm-before -p "kill session #S? (y/n)" kill-session

# Scratch session, toggled with Alt+`
bind-key -n M-` if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 80% -E 'tmux attach-session -t scratch || tmux new-session -s scratch'
}

# Status line
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g status-style "bg=default,fg=#6a6a6a"
set-option -g status-left-length 40
set-option -g status-right-length 60
set-option -g status-justify absolute-centre

set-option -g status-left "#[fg=#222222,bg=#e8e8e8,bold] #S #[fg=#e8e8e8,bg=default,nobold]#{?client_prefix,#[fg=#a08080] ●,}"
set-option -g status-right "#[fg=#4a4a4a]#{b:pane_current_path} #[fg=#333333]│ #[fg=#9a9a9a]%H:%M "

set-option -g window-status-format "#[fg=#4a4a4a] #I #W "
set-option -g window-status-current-format "#[fg=#e8e8e8,bold] #I #W "
set-option -g window-status-bell-style "fg=#a08080"
set-option -g window-status-separator ""

set-option -g message-style "bg=#393939,fg=#e8e8e8"
set-option -g message-command-style "bg=#393939,fg=#e8e8e8"
set-option -g mode-style "bg=#e8e8e8,fg=#222222"

set-option -g pane-border-style "fg=#2e2e2e"
set-option -g pane-active-border-style "fg=#5a5a5a"
set-option -g pane-border-lines single
set-option -g display-panes-colour "#4a4a4a"
set-option -g display-panes-active-colour "#e8e8e8"

set-option -g popup-style "bg=default"
set-option -g popup-border-style "fg=#393939"
set-option -g popup-border-lines rounded
