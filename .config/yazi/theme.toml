# Yazi theme configuration
# https://yazi-rs.github.io/docs/configuration/theme
#
# Colours, file type colours, icons and syntax highlighting come from the
# "noctalia" flavor in flavors/noctalia.yazi/: kitty palette slots, so open
# yazis follow a theme switch, plus preview syntax colours Noctalia renders.
# Only layout and glyph settings live here; a colour set here would override the flavor.

[flavor]
dark = "noctalia"
light = "noctalia"

[mgr]
preview_hovered = { underline = true }
tab_width = 1
border_symbol = "│"

[status]
separator_open = ""
separator_close = ""

[input]
selected = { reversed = true }

[which]
separator = " → "
separator_style = {}

# The user's own icons, ahead of the flavor's (which tints every icon with the
# accent). Colours are terminal colour names, so they follow kitty's theme.
[icon]
prepend_exts = [
	# Programming languages
	{ name = "rs", text = "", fg = "lightred" },
	{ name = "go", text = "", fg = "cyan" },
